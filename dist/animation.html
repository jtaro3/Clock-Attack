<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#101923">
  <title>演出確認 — 針の刻</title>
  <style>
    :root{font-family:system-ui,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#f5f1dc;background:#000}
    *{box-sizing:border-box}
    body{margin:0;height:100vh;height:100dvh;overflow:hidden;background:#000}
    .title-link,.category,.sub-choice,.small-button{border:1px solid #668674;border-radius:9px;background:#24453b;color:#f4f1e7;font-size:14px;font-weight:800;text-decoration:none;white-space:nowrap}
    .title-link{display:block;width:100%;padding:12px 14px;background:#9e2929;border-color:#ff7c73;text-align:center;cursor:pointer}
    button{font:inherit}
    .category,.sub-choice,.small-button{padding:9px 12px;cursor:pointer}
    .category.active,.sub-choice.active{background:#e6c987;color:#172721;border-color:#e6c987}
    .screen{height:100%;display:none;background:#000}
    .screen.active{display:flex}
    .home{width:100%;height:100%;display:grid;place-items:center;padding:20px}
    .home-nav{display:grid;gap:10px;width:min(100%,340px);padding:20px;background:#142a28;border:1px solid #668674;border-radius:16px}
    .home-nav button{min-height:48px;text-align:left;padding:10px 14px}
    .home-version{margin:4px 0 0;color:#e4c47b;font-size:12px;font-weight:800;letter-spacing:.12em;text-align:center}
    .workspace{display:flex;width:100%;height:100%;min-height:0}
    .preview-pane{position:relative;flex:1;min-width:0;min-height:0;display:grid;place-items:center;background:#000}
    .hint{position:absolute;inset:0;display:grid;place-items:center;color:#aeb9b3;font-size:14px;text-align:center;padding:18px}
    .hint[hidden]{display:none}
    iframe{display:none;width:100%;height:100%;border:0;background:#000}
    iframe.active{display:block}
    #assetCanvas{display:none;width:100%;height:100%;max-width:760px;max-height:100%;object-fit:contain;touch-action:none}
    #assetCanvas.active{display:block}
    .debug-panel{order:-1;width:min(330px,40vw);min-width:270px;overflow-y:auto;padding:14px;background:#142a28;border-right:1px solid #d6c18c55;overscroll-behavior:contain;display:flex;flex-direction:column}
    .debug-panel[hidden]{display:none}
    .bottom-link{margin-top:auto;flex-shrink:0}
    .panel-title{margin:0 0 10px;font-size:17px}
    .choices{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 12px}
    .file-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:34vh;overflow:auto;margin:8px 0 12px;padding-right:3px;flex-shrink:0}
    .file-choice{min-width:0;padding:8px 5px;border:1px solid #668674;border-radius:10px;background:#0c211d;color:#eff5e8;cursor:pointer;text-align:center;overflow-wrap:anywhere}
    .file-choice.active{border:2px solid #e6c987;background:#354936}
    .file-choice canvas{display:block;width:56px;height:56px;margin:0 auto 4px;image-rendering:pixelated}
    .file-choice span{display:block;font-size:12px;line-height:1.25}
    .loop-row{display:flex;align-items:center;gap:9px;padding:10px 0;border-top:1px solid #ffffff22;border-bottom:1px solid #ffffff22;font-weight:800}
    .loop-row[hidden]{display:none}
    .loop-row input{width:20px;height:20px;accent-color:#e6c987}
    .tuning{display:grid;gap:10px;margin-top:12px}
    .tuning[hidden]{display:none}
    .slider-row{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center}
    .slider-row[hidden],.frame-settings[hidden]{display:none}
    .frame-settings{display:contents}
    .slider-row label{font-weight:700;font-size:13px}
    .slider-row output{font-variant-numeric:tabular-nums;color:#f1d58e;font-weight:800}
    .slider-row input{grid-column:1/-1;width:100%;accent-color:#e6c987}
    .save-hint{font-size:12px;color:#c2d0c6;line-height:1.45;margin:0}
    .small-button{width:100%;margin-top:4px}
    .enemy-picker{display:grid;gap:6px;margin-bottom:12px;font-size:13px;font-weight:700}
    .enemy-picker[hidden]{display:none}
    .enemy-picker select,.enemy-picker input{width:100%;min-width:0;padding:9px;border:1px solid #668674;border-radius:9px;background:#0c211d;color:#f4f1e7;font:inherit}
    .notice{font-size:13px;color:#f1d58e;min-height:1.3em}
    .range-hit-status{font-size:12px;color:#c2d0c6;align-self:center;min-width:0;overflow-wrap:anywhere}
    @media(max-width:720px){
      .category{font-size:12px;padding:8px}
      .workspace{flex-direction:column}
      .preview-pane{flex:1 1 54%;min-height:160px}
      .debug-panel{order:2;width:100%;min-width:0;flex:0 0 46%;height:46%;max-height:46%;border-right:0;border-top:1px solid #d6c18c55;padding:10px 12px}
      .file-list{grid-template-columns:repeat(3,minmax(0,1fr));max-height:18vh}
      .file-choice canvas{width:44px;height:44px}
      .tuning{grid-template-columns:repeat(2,minmax(0,1fr))}
      .loop-row,.save-hint,.small-button,.notice{grid-column:1/-1}
    }
  </style>
</head>
<body>
  <section id="home" class="screen active">
    <div class="home">
      <nav class="home-nav" aria-label="演出を選択">
        <a class="title-link" href="index.html">タイトルへ</a>
        <button class="category" data-category="hourglass">砂時計演出</button>
        <button class="category" data-category="victory">勝利演出</button>
        <button class="category" data-category="attackRange">攻撃範囲</button>
        <button class="category" data-category="player">プレイヤー</button>
        <button class="category" data-category="enemy">エネミー</button>
        <a class="title-link" href="sandbox.html">対戦サンドバッグ</a>
        <p class="home-version" id="version">VERSION 読み込み中</p>
      </nav>
    </div>
  </section>
  <section id="previewScreen" class="screen">
    <div class="workspace">
      <div class="preview-pane">
        <div id="hint" class="hint">演出を選択してください</div>
        <iframe id="gameFrame" title="ゲーム演出"></iframe>
        <canvas id="assetCanvas" aria-label="キャラクター画像のプレビュー"></canvas>
      </div>
      <aside id="debugPanel" class="debug-panel" hidden>
        <h2 id="debugTitle" class="panel-title">画像確認</h2>
        <div id="enemyPicker" class="enemy-picker" hidden>
          <label for="enemySearch">エネミーを検索</label>
          <input id="enemySearch" type="search" placeholder="例：slime、blue" autocomplete="off">
          <span id="enemySearchStatus" class="save-hint" aria-live="polite"></span>
          <label for="enemySelect">確認するエネミー</label>
          <select id="enemySelect" disabled aria-label="確認するエネミー"></select>
        </div>
        <div id="subChoices" class="choices"></div>
        <div id="fileList" class="file-list" aria-label="画像一覧"></div>
        <label class="loop-row"><input id="loopToggle" type="checkbox">表示画像を順番にループ</label>
        <div id="rangePanel" class="tuning" hidden>
          <div class="choices"><button id="rangeOwnerPlayer" class="sub-choice active" type="button">プレイヤー</button><button id="rangeOwnerEnemy" class="sub-choice" type="button">エネミー</button></div>
          <div id="rangeModes" class="choices"><button class="sub-choice active" data-range-mode="normal" type="button">通常攻撃</button><button class="sub-choice" data-range-mode="spin" type="button">回転斬り</button><button class="sub-choice" data-range-mode="object" type="button">オブジェクト</button></div>
          <label class="loop-row"><input id="rangeGridToggle" type="checkbox" checked>グリッド表示（32px）</label>
          <div class="slider-row"><label id="rangeDistanceLabel" for="rangeDistance">通常攻撃の距離</label><output id="rangeDistanceValue"></output><input id="rangeDistance" type="range" min="0" max="200" step="1" value="51"></div>
          <div class="slider-row" id="rangeAngleRow"><label id="rangeAngleLabel" for="rangeAngle">通常攻撃の角度</label><output id="rangeAngleValue"></output><input id="rangeAngle" type="range" min="0" max="360" step="1" value="203"></div>
          <div class="slider-row"><label id="rangeFacingLabel" for="rangeFacing">プレイヤーの向き</label><output id="rangeFacingValue">0°</output><input id="rangeFacing" type="range" min="0" max="359" step="1" value="0"></div>
          <p id="rangeHelp" class="save-hint">初期値は通常42px・182°、回転42px・360°、オブジェクト42px・203°です。調整値はこのブラウザー内に保存し、「調整値をコピー」で取り出せます。</p>
          <div class="choices"><button id="rangeAttackTest" class="small-button" type="button">攻撃テスト</button><output id="rangeHitStatus" aria-live="polite">エネミーをドラッグして位置を調整します</output></div>
          <button id="copyRangeSettings" class="small-button" type="button">調整値をコピー</button>
          <button id="loadRangeSettings" class="small-button" type="button">現在のゲーム設定に戻す</button>
          <div id="rangeNotice" class="notice" aria-live="polite"></div>
        </div>
        <div id="tuning" class="tuning" hidden>
          <div class="slider-row move-setting"><label for="moveSpeed">移動速度</label><output id="moveSpeedValue"></output><input id="moveSpeed" type="range" min="0" max="80" step="1" value="27"></div>
          <div id="moveSettings" class="frame-settings" hidden></div>
          <div id="attackSettings" class="frame-settings" hidden></div>
          <p class="save-hint">調整値はこのブラウザーに保存され、演出確認のプレビューに反映します。本番ゲームはマスターの値を使います。台帳をCSV出力した後は「ゲームデータの値に戻す」で同期できます。</p>
          <button id="loadDataSettings" class="small-button" type="button">ゲームデータの値に戻す</button>
          <button id="copySettings" class="small-button" type="button">調整値をコピー</button>
          <div id="notice" class="notice" aria-live="polite"></div>
        </div>
        <button id="backToList" class="title-link bottom-link" type="button">戻る</button>
      </aside>
    </div>
  </section>
  <script>
    fetch('VERSION',{cache:'no-store'})
      .then(response=>{if(!response.ok)throw new Error('Version unavailable');return response.text()})
      .then(value=>{const version=value.trim();if(!/^\d+\.\d+(?:\.\d+)?$/.test(version))throw new Error('Invalid version');document.getElementById('version').textContent=`VERSION ${version}`})
      .catch(()=>{document.getElementById('version').textContent='VERSION 取得できません'});
  </script>
  <script src="attack-range.js?v=1.30"></script>
  <script src="asset-paths.js?v=1.19"></script><script src="animation-preview.js?v=1.31"></script>
</body>
</html>
