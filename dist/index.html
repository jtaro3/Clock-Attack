<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#101923">
  <title>針の刻 — 時計で戦うゲーム</title>
  <style>
    :root{font-family:system-ui,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#f4f1e7;background:#101923;touch-action:none;user-select:none;-webkit-user-select:none}
    *{box-sizing:border-box}body{margin:0;overflow:hidden}button{font:inherit;touch-action:none;-webkit-tap-highlight-color:transparent}
    #app{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#172530}
    canvas{display:block;width:100%;height:100%}
    .hud{position:absolute;top:env(safe-area-inset-top);left:0;right:0;padding:12px 16px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;text-shadow:0 2px 8px #071016}
    .brand{font-size:12px;letter-spacing:.2em;color:#d6c18c;font-weight:900}.score{font-size:23px;font-weight:900;line-height:1.25}.status{text-align:right;font-size:13px;line-height:1.6;font-weight:800}
    .status b{font-size:19px}.controls{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));height:132px;pointer-events:none}
    .stick{position:absolute;left:20px;bottom:2px;width:116px;height:116px;border:2px solid #d5d6c177;border-radius:50%;background:#e7e9d014;pointer-events:auto;touch-action:none;display:grid;place-items:center}
    .stick:before{content:"";position:absolute;inset:22px;border:1px solid #f5efc84d;border-radius:50%}.knob{width:48px;height:48px;border-radius:50%;background:#e5d49e;border:3px solid #fff4cb;box-shadow:0 5px 15px #0006;transform:translate(0,0)}
    .actions{position:absolute;right:18px;bottom:0;display:flex;align-items:end;gap:12px;pointer-events:auto}.action{width:78px;height:78px;border:2px solid #f6e2a4;border-radius:21px;background:#263746d9;color:#fff5db;box-shadow:0 8px 20px #0007;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;font-weight:900}.action:active,.action.active{transform:scale(.95);background:#7e6240}.action .icon{font-size:28px;line-height:1}.action small{font-size:12px}.action b{font-size:14px}.action:disabled{opacity:.42}
    .hint{position:absolute;bottom:calc(155px + env(safe-area-inset-bottom));left:12px;right:12px;text-align:center;color:#f4efdfaa;font-size:11px;pointer-events:none}
    .overlay{position:absolute;inset:0;background:#0c1824df;display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));z-index:5}.overlay.hidden{display:none}.panel{width:min(100%,430px);max-height:100%;overflow:auto;text-align:center;border:1px solid #e6d6ac55;border-radius:24px;background:linear-gradient(155deg,#253742,#14242f);padding:22px 20px 25px;box-shadow:0 20px 65px #0008}.eyebrow{color:#dfbd73;font-size:12px;font-weight:900;letter-spacing:.18em}.panel h1{font-size:27px;margin:8px 0 4px;letter-spacing:.08em}.panel p{margin:6px 0 14px;color:#dddccf;font-size:13px;line-height:1.6}.clock{position:relative;width:min(55vw,215px);height:min(55vw,215px);margin:10px auto 12px;border-radius:50%;border:8px solid #d8bd82;background:radial-gradient(circle,#f8efd8,#ded1af);box-shadow:0 0 0 5px #8b6e46,0 12px 26px #0006}.tick{position:absolute;left:50%;top:50%;width:2px;height:8px;background:#6a5947;transform-origin:50% 0}.numeral{position:absolute;transform:translate(-50%,-50%);color:#3b4447;font-size:14px;font-weight:900}.hand{position:absolute;left:50%;top:50%;transform-origin:50% 100%;border-radius:9px}.hand.hour{width:7px;height:52px;margin-left:-3.5px;margin-top:-52px;background:#bd6453;box-shadow:0 0 3px #333}.hand.minute{width:4px;height:75px;margin-left:-2px;margin-top:-75px;background:#3d7780}.pin{position:absolute;left:50%;top:50%;width:13px;height:13px;border-radius:50%;background:#343b40;transform:translate(-50%,-50%)}.readout{font-size:32px;font-weight:900;letter-spacing:.12em;font-variant-numeric:tabular-nums}.gains{display:flex;justify-content:center;gap:10px;margin:7px 0 15px}.gain{padding:7px 13px;border-radius:10px;background:#ffffff13;font-size:13px;font-weight:800}.gain strong{font-size:20px;color:#ffdda2}.gain.move strong{color:#9ae0df}.primary{min-width:180px;padding:13px 28px;background:#e7c47e;border:0;border-radius:999px;color:#202c31;font-size:17px;font-weight:900;box-shadow:0 5px 0 #9f783e}.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #9f783e}.sub{font-size:11px!important;color:#c3c9c4!important;margin:15px 0 0!important}.gameover .clock,.gameover .gains,.gameover .readout{display:none}
    @media(max-height:650px){.panel{padding:13px}.panel p{margin:3px 0 8px}.clock{width:145px;height:145px;margin:4px auto}.hand.hour{height:37px;margin-top:-37px}.hand.minute{height:53px;margin-top:-53px}.gains{margin:2px 0 8px}.panel h1{font-size:22px}.readout{font-size:25px}}
    @media(max-width:360px){.hud{padding:10px}.score{font-size:19px}.status{font-size:11px}.status b{font-size:16px}.stick{left:12px;width:100px;height:100px}.actions{right:12px;gap:8px}.action{width:68px;height:72px;border-radius:17px}.action .icon{font-size:24px}.action small{font-size:10px}.hint{font-size:10px}}
  </style>
</head>
<body>
<main id="app">
  <canvas id="field" aria-label="ゲーム盤面"></canvas>
  <div class="hud"><div><div class="brand">針の刻</div><div class="score">討伐 <span id="score">0</span></div></div><div class="status">体力 <span id="health">♥ ♥ ♥</span><br>🗡 <b id="attacks">0</b> 回　👟 <b id="distance">0</b></div></div>
  <div class="hint">左のパッドで方向を決め、靴を押して移動</div>
  <div class="controls"><div id="stick" class="stick" aria-label="方向パッド"><div id="knob" class="knob"></div></div><div class="actions"><button id="move" class="action" aria-label="移動"><span class="icon">👟</span><small>移動距離</small><b id="moveCount">0</b></button><button id="attack" class="action" aria-label="剣で攻撃"><span class="icon">🗡️</span><small>攻撃回数</small><b id="attackCount">0</b></button></div></div>
  <div id="overlay" class="overlay"><div id="panel" class="panel"><div class="eyebrow" id="eyebrow">3秒で一周する時計</div><h1 id="title">時を止めて、戦え。</h1><p id="description">短針は剣を振る回数、長針は移動できる距離。<br>好きな瞬間に時計を止めて、行動量を決めよう。</p><div class="clock" id="clock"><div class="hand hour" id="hourHand"></div><div class="hand minute" id="minuteHand"></div><div class="pin"></div></div><div id="readout" class="readout">01:01</div><div class="gains"><div class="gain">🗡 <strong id="previewAttack">1</strong> 回</div><div class="gain move">👟 <strong id="previewMove">1</strong> 距離</div></div><button id="stop" class="primary">時計を止める</button><p class="sub" id="sub">時計は止めるまで回り続けます</p></div></div>
</main>
<script>
(()=>{
  'use strict';
  const $=id=>document.getElementById(id),canvas=$('field'),ctx=canvas.getContext('2d');
  const ui={overlay:$('overlay'),panel:$('panel'),title:$('title'),eyebrow:$('eyebrow'),description:$('description'),readout:$('readout'),hourHand:$('hourHand'),minuteHand:$('minuteHand'),previewAttack:$('previewAttack'),previewMove:$('previewMove'),stop:$('stop'),sub:$('sub'),score:$('score'),health:$('health'),attacks:$('attacks'),distance:$('distance'),attackCount:$('attackCount'),moveCount:$('moveCount'),attack:$('attack'),move:$('move'),stick:$('stick'),knob:$('knob')};
  let w=0,h=0,dpr=1,last=performance.now(),mode='select',clockOrigin=last-((1*60+1)/1440)*3000,attacks=0,distance=0,health=3,score=0,spawnTimer=0,invincible=0,swing=0,swingAngle=0,shake=0;
  const player={x:0,y:0,r:14,angle:-Math.PI/2};const enemies=[],particles=[];const input={x:0,y:0,move:false,pointer:null};
  const minY=()=>Math.max(92, h*.12),maxY=()=>Math.max(minY()+60,h-175);
  function resize(){const oldW=w,oldH=h,app=$('app');w=app.clientWidth;h=app.clientHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(!oldW){player.x=w/2;player.y=(minY()+maxY())/2}else{player.x=clamp(player.x*w/oldW,18,w-18);player.y=clamp(player.y*h/oldH,minY()+18,maxY()-18)}}
  function clamp(v,a,b){return Math.max(a,Math.min(b,v))}addEventListener('resize',resize);window.visualViewport?.addEventListener('resize',resize);resize();
  const face=$('clock');for(let i=0;i<60;i++){const t=document.createElement('i');t.className='tick';const angle=i*6*Math.PI/180,r=face.offsetWidth*.43;t.style.transform=`translate(-50%,-50%) translate(${Math.sin(angle)*r}px,${-Math.cos(angle)*r}px) rotate(${i*6}deg)`;t.style.height=i%5? '5px':'10px';face.insertBefore(t,ui.hourHand)}for(let n=1;n<=12;n++){const s=document.createElement('span'),a=n*Math.PI/6,r=face.offsetWidth*.35;s.className='numeral';s.textContent=n;s.style.left=`calc(50% + ${Math.sin(a)*r}px)`;s.style.top=`calc(50% - ${Math.cos(a)*r}px)`;face.insertBefore(s,ui.hourHand)}
  function timeValues(now){let phase=((now-clockOrigin)%3000+3000)%3000/3000;let total=Math.floor(phase*1440);let hour24=Math.floor(total/60),minute=total%60;return {hour24,minute,attack:hour24%12||12,text:String(hour24).padStart(2,'0')+':'+String(minute).padStart(2,'0'),phase}}
  function updateClock(now){const t=timeValues(now);ui.readout.textContent=t.text;ui.previewAttack.textContent=t.attack;ui.previewMove.textContent=t.minute;ui.hourHand.style.transform=`rotate(${t.phase*720}deg)`;ui.minuteHand.style.transform=`rotate(${(t.minute/60)*360}deg)`;return t}
  function setHud(){ui.score.textContent=score;ui.health.textContent='♥ '.repeat(health).trim()||'—';ui.attacks.textContent=ui.attackCount.textContent=attacks;ui.distance.textContent=ui.moveCount.textContent=Math.floor(distance);ui.attack.disabled=mode!=='play'||attacks<=0;ui.move.disabled=mode!=='play'||distance<=0}
  function startSelection(initial=false){mode='select';input.move=false;ui.move.classList.remove('active');clockOrigin=performance.now()-(initial?(61/1440)*3000:0);ui.overlay.classList.remove('hidden');ui.panel.classList.remove('gameover');ui.eyebrow.textContent=initial?'3秒で一周する時計':'行動量を使い切った';ui.title.textContent=initial?'時を止めて、戦え。':'次の時刻を決めよう';ui.description.innerHTML=initial?'短針は剣を振る回数、長針は移動できる距離。<br>好きな瞬間に時計を止めて、行動量を決めよう。':'戦闘は一時停止中。<br>時計を止めると、剣と移動距離が補充されます。';ui.stop.textContent='時計を止める';ui.sub.textContent='時計は止めるまで3秒ごとに回り続けます';setHud()}
  function stopClock(){if(mode==='gameover'){restart();return}if(mode!=='select')return;const t=updateClock(performance.now());attacks=t.attack;distance=t.minute;mode='play';ui.overlay.classList.add('hidden');spawnTimer=0;setHud()}
  ui.stop.addEventListener('click',stopClock);
  function restart(){health=3;score=0;attacks=0;distance=0;enemies.length=0;particles.length=0;player.x=w/2;player.y=(minY()+maxY())/2;invincible=0;swing=0;startSelection(true)}
  function gameOver(){mode='gameover';input.move=false;ui.overlay.classList.remove('hidden');ui.panel.classList.add('gameover');ui.eyebrow.textContent='GAME OVER';ui.title.textContent=`討伐 ${score} 体`;ui.description.innerHTML='時計を止めるタイミングを変えて、もう一度挑戦しよう。';ui.stop.textContent='もう一度遊ぶ';ui.sub.textContent='';setHud()}
  function setDirection(clientX,clientY){const r=ui.stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=clientX-cx,dy=clientY-cy,len=Math.hypot(dx,dy),max=(r.width-50)/2;input.x=len<6?0:dx/Math.max(len,1);input.y=len<6?0:dy/Math.max(len,1);ui.knob.style.transform=`translate(${input.x*Math.min(len,max)}px,${input.y*Math.min(len,max)}px)`;if(len>=6)player.angle=Math.atan2(input.y,input.x)}
  ui.stick.addEventListener('pointerdown',e=>{ui.stick.setPointerCapture(e.pointerId);input.pointer=e.pointerId;setDirection(e.clientX,e.clientY)});ui.stick.addEventListener('pointermove',e=>{if(input.pointer===e.pointerId)setDirection(e.clientX,e.clientY)});function releaseStick(e){if(input.pointer!==e.pointerId)return;input.pointer=null;input.x=input.y=0;ui.knob.style.transform='translate(0,0)'}ui.stick.addEventListener('pointerup',releaseStick);ui.stick.addEventListener('pointercancel',releaseStick);
  function releaseMove(){input.move=false;ui.move.classList.remove('active')}ui.move.addEventListener('pointerdown',e=>{if(mode!=='play'||distance<=0)return;ui.move.setPointerCapture(e.pointerId);input.move=true;ui.move.classList.add('active')});ui.move.addEventListener('pointerup',releaseMove);ui.move.addEventListener('pointercancel',releaseMove);ui.move.addEventListener('lostpointercapture',releaseMove);
  ui.attack.addEventListener('pointerdown',e=>{e.preventDefault();attack()});const keys=new Set();addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys.add(e.code);if(e.code==='Space')attack()});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>{keys.clear();releaseMove()});
  function attack(){if(mode!=='play'||attacks<=0||swing>0)return;attacks--;swing=.27;swingAngle=player.angle;const ax=Math.cos(player.angle),ay=Math.sin(player.angle);for(let i=enemies.length-1;i>=0;i--){const enemy=enemies[i],dx=enemy.x-player.x,dy=enemy.y-player.y,dist=Math.hypot(dx,dy);if(dist<player.r+enemy.r+51&&(dist<25||(dx*ax+dy*ay)/dist>-.2)){enemy.hp--;enemy.hit=.18;burst(enemy.x,enemy.y,enemy.color,6);if(enemy.hp<=0){score++;burst(enemy.x,enemy.y,enemy.color,11);enemies.splice(i,1)}}}setHud();checkExhausted()}
  function checkExhausted(){if(mode==='play'&&attacks<=0&&distance<.999)startSelection(false)}
  function spawn(){const hp=1+Math.floor(Math.random()*3),edge=Math.floor(Math.random()*4),r=12+hp*2;let x,y;if(edge===0){x=-r;y=minY()+Math.random()*(maxY()-minY())}else if(edge===1){x=w+r;y=minY()+Math.random()*(maxY()-minY())}else if(edge===2){x=Math.random()*w;y=minY()-r}else{x=Math.random()*w;y=maxY()+r}enemies.push({x,y,r,hp,color:['#66c8ee','#74d590','#e97a83'][hp-1],speed:21+Math.random()*12+score*.3,hit:0,wobble:Math.random()*6.28})}
  function burst(x,y,color,count){for(let i=0;i<count;i++){let a=Math.random()*Math.PI*2,s=35+Math.random()*90;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.25+Math.random()*.3,max:.55,color})}}
  function update(dt){if(mode!=='play')return;let dx=input.x,dy=input.y;if(keys.has('ArrowLeft')||keys.has('KeyA'))dx-=1;if(keys.has('ArrowRight')||keys.has('KeyD'))dx+=1;if(keys.has('ArrowUp')||keys.has('KeyW'))dy-=1;if(keys.has('ArrowDown')||keys.has('KeyS'))dy+=1;let mag=Math.hypot(dx,dy);if(mag>0){dx/=mag;dy/=mag;player.angle=Math.atan2(dy,dx)}if((input.move||keys.has('ShiftLeft')||keys.has('ShiftRight'))&&distance>0&&mag>0){const step=Math.min(155*dt,distance*8),oldX=player.x,oldY=player.y;player.x=clamp(player.x+dx*step,player.r+4,w-player.r-4);player.y=clamp(player.y+dy*step,minY()+player.r,maxY()-player.r);distance=Math.max(0,distance-Math.hypot(player.x-oldX,player.y-oldY)/8);if(distance<.999)distance=0;setHud();checkExhausted()}spawnTimer+=dt;if(spawnTimer>Math.max(.65,1.8-score*.02)){spawnTimer=0;spawn()}invincible=Math.max(0,invincible-dt);swing=Math.max(0,swing-dt);shake=Math.max(0,shake-dt);for(const enemy of enemies){enemy.wobble+=dt*5;enemy.hit=Math.max(0,enemy.hit-dt);let ex=player.x-enemy.x,ey=player.y-enemy.y,d=Math.hypot(ex,ey)||1;enemy.x+=ex/d*enemy.speed*dt;enemy.y+=ey/d*enemy.speed*dt;if(d<player.r+enemy.r-3&&invincible<=0){health--;invincible=1.15;shake=.2;burst(player.x,player.y,'#fff4dc',9);setHud();if(health<=0){gameOver();break}}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}}
  function draw(now){ctx.clearRect(0,0,w,h);ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*5,(Math.random()-.5)*5);const bg=ctx.createLinearGradient(0,0,w,h);bg.addColorStop(0,'#253f46');bg.addColorStop(1,'#152b38');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);ctx.strokeStyle='#d6dfcf10';ctx.lineWidth=1;const grid=32;for(let x=0;x<w;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.strokeStyle='#e7d49e55';ctx.lineWidth=2;ctx.strokeRect(8,minY(),w-16,maxY()-minY());for(const enemy of enemies){const y=enemy.y+Math.sin(enemy.wobble)*2;ctx.fillStyle='#0b172277';ctx.beginPath();ctx.ellipse(enemy.x,y+enemy.r*.8,enemy.r,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=enemy.hit>0?'#fff':enemy.color;ctx.beginPath();ctx.arc(enemy.x,y,enemy.r,Math.PI,0);ctx.quadraticCurveTo(enemy.x+enemy.r,y+enemy.r*.85,enemy.x,y+enemy.r*.7);ctx.quadraticCurveTo(enemy.x-enemy.r,y+enemy.r*.85,enemy.x-enemy.r,y);ctx.fill();ctx.fillStyle='#24333b';ctx.beginPath();ctx.arc(enemy.x-5,y-2,2,0,7);ctx.arc(enemy.x+5,y-2,2,0,7);ctx.fill()}for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x-2,p.y-2,4,4)}ctx.globalAlpha=1;if(swing>0){ctx.strokeStyle=`rgba(255,224,158,${swing/.27})`;ctx.lineWidth=12;ctx.lineCap='round';ctx.beginPath();ctx.arc(player.x,player.y,49,swingAngle-.95,swingAngle+.95);ctx.stroke()}ctx.globalAlpha=invincible>0&&Math.floor(now/90)%2? .4:1;ctx.fillStyle='#111d26aa';ctx.beginPath();ctx.ellipse(player.x,player.y+14,17,6,0,0,7);ctx.fill();ctx.fillStyle='#f3eee0';ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,7);ctx.fill();ctx.fillStyle='#566d75';ctx.beginPath();ctx.arc(player.x,player.y,player.r-5,0,7);ctx.fill();ctx.strokeStyle='#e4c98e';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(player.x,player.y);ctx.lineTo(player.x+Math.cos(player.angle)*18,player.y+Math.sin(player.angle)*18);ctx.stroke();ctx.globalAlpha=1;ctx.restore()}
  function frame(now){let dt=Math.min((now-last)/1000,.05);last=now;if(mode==='select')updateClock(now);update(dt);draw(now);requestAnimationFrame(frame)}setHud();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
