<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ショップサンプル — 針の刻</title><style>
:root{font-family:system-ui,"Yu Gothic",sans-serif;color:#f5efda;background:#091715}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#28453b,#091715 75%)}button{font:inherit;cursor:pointer}main{max-width:860px;margin:auto;padding:36px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid #b59b5e66;padding-bottom:24px}h1{font-family:serif;font-size:36px;letter-spacing:.12em;margin:4px 0}.eyebrow{color:#d5b56c;font-size:12px;letter-spacing:.25em}.wallet{background:#0b201c;border:1px solid #9e8a56;border-radius:12px;padding:12px 20px;text-align:right}.wallet small{display:block;color:#c7c9b5}.wallet strong{font-size:28px;color:#f4d68e}.intro{color:#c0c8b9;line-height:1.8}.products{display:grid;gap:12px;margin:28px 0}.product{width:100%;display:flex;align-items:center;gap:20px;padding:20px 24px;background:#1c352d;color:#f5efda;border:1px solid #66785c;border-radius:12px;text-align:left;min-height:106px;transition:background .15s}.product:hover{background:#294b3d;border-color:#e0c27a}.sale{font-size:11px;letter-spacing:.1em;font-weight:900;background:#b54035;color:#fff1cd;border-radius:4px;padding:6px 9px;min-width:56px;text-align:center}.sale.empty{visibility:hidden}.icon{width:44px;height:52px;object-fit:contain;image-rendering:pixelated}.info{flex:1}.name{display:block;font-size:18px;font-weight:700}.detail{display:block;font-size:12px;color:#b6c6b5;margin-top:5px}.price{font-size:23px;color:#efd28c;text-align:right;white-space:nowrap}.price del{display:block;font-size:12px;color:#a6b29e}.price small{font-size:12px}.unaffordable{filter:grayscale(1);opacity:.55}.preparing{background:repeating-linear-gradient(0deg,#513923 0px,#513923 9px,#594029 10px,#594029 12px);border-color:#9b754a;justify-content:center;box-shadow:inset 0 0 20px #21150c66;color:#e2c49d;cursor:default;letter-spacing:.3em;font-size:21px;font-family:serif}.preparing:hover{background:repeating-linear-gradient(0deg,#513923 0px,#513923 9px,#594029 10px,#594029 12px);border-color:#9b754a}.message{min-height:52px;padding:14px;border-radius:8px;color:#f4d68e;background:#0b201c;text-align:center}.footer{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:24px;color:#a9b6a7;font-size:12px}.reset{background:transparent;color:#d8c68d;border:1px solid #66785c;border-radius:8px;padding:10px 15px}a{color:#d8c68d}@media(max-width:550px){main{padding:24px 14px}h1{font-size:28px}.product{gap:12px;padding:16px 12px}.sale{min-width:42px;padding:6px 4px;font-size:10px}.name{font-size:16px}.price{font-size:20px}.wallet{padding:10px 12px}.footer{align-items:flex-start}}
</style></head><body><main><header><div><span class="eyebrow">針の刻 / SHOP</span><h1>旅の商店</h1></div><div class="wallet"><small>所持金</small><strong><span id="money">800</span> <span style="font-size:14px">G</span></strong></div></header><p class="intro">次の戦いに備えて、ひと休み。<br>商品をタップすると購入できます。</p><section class="products" aria-label="商品一覧" id="products"></section><div class="message" role="status" aria-live="polite" id="message">いらっしゃいませ。何をお探しですか？</div><div class="footer"><span>見た目・購入動作のサンプル · v1.46<br>商品と金額は仮設定です。</span><button class="reset" id="reset">所持金を800 Gに戻す</button></div></main><script>
const products=[{name:'青の砂',image:'bottle_blue.png',price:100,detail:'青い砂を詰めた、小さなビン。'},{name:'緑の砂',image:'bottle_green.png',price:300,original:500,detail:'今だけのお買い得品。'},{name:'赤の砂',image:'bottle_red.png',price:1000,detail:'戦いの備えに、赤い砂を。'},{preparing:true}];let money=800;const list=document.getElementById('products');const message=document.getElementById('message');function render(){document.getElementById('money').textContent=money.toLocaleString('ja-JP');list.replaceChildren();products.forEach(p=>{const row=document.createElement('button');row.type='button';row.className='product';if(p.preparing){row.classList.add('preparing');row.textContent='準備中';row.disabled=true;}else{if(money<p.price)row.classList.add('unaffordable');row.innerHTML=`<span class="sale ${p.original?'':'empty'}">SALE</span><img class="icon" src="design/items/${p.image}" alt=""><span class="info"><span class="name">${p.name}</span><span class="detail">${p.detail}</span></span><span class="price">${p.original?`<del>${p.original} G</del>`:''}${p.price.toLocaleString('ja-JP')} <small>G</small></span>`;row.addEventListener('click',()=>{if(money<p.price){message.textContent='所持金が足りません';return;}money-=p.price;render();message.textContent=`${p.name}を購入しました（${p.price} G）`;});}list.append(row);});}document.getElementById('reset').addEventListener('click',()=>{money=800;render();message.textContent='所持金を800 Gに戻しました';});render();
</script></body></html>
