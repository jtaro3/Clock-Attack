    @media(max-height:380px){.panel.refill{height:100%;padding:8px 16px}.panel.refill>.merge-stage{height:230px}.panel.refill .merge-bottles{height:94px;flex-basis:94px}.panel.refill .sand-preview .hourglass-svg,.panel.refill .merge-hourglass,.panel.refill .merge-hourglass .hourglass-svg{width:80px;height:100px}.panel.refill>.result-value{font-size:56px;margin-top:4px}.panel.refill .powder-fall{top:40px}.panel.refill .merge-stage.collapsing .merge-bottle{transform:translate(-50%,calc(-50% + 105px)) scale(.18) rotate(var(--merge-rotate))}}
    .panel.refill .merge-bottles{transform:scale(.9)}
.top-actions{flex-wrap:wrap;justify-content:flex-end} .energy-bar.recovering{animation:energy-recovery-glow .55s ease-in-out infinite alternate;border-color:#fff2a8}.energy-bar.recovering .energy-fill{background:linear-gradient(90deg,#e9b94b,#fff2a8);box-shadow:inset -8px 0 12px #fff8}@keyframes energy-recovery-glow{from{box-shadow:0 0 8px #ffd65b99,0 0 18px #ffcd4566}to{box-shadow:0 0 16px #ffe899,0 0 34px #ffd65baa}}.stock-slot{background:transparent;border-color:transparent;box-shadow:none}.stock-slot.unlocked{background:rgba(75,80,85,.85);border-color:#c5c9cd;box-shadow:inset 0 0 0 1px #ffffff18}.stock-slot img{width:min(22px,90%);height:min(26px,90%);object-fit:contain}.stock-slot svg{stroke:#fffaf0;stroke-width:2.2;filter:drop-shadow(0 1px 2px #14292f)}.stock-slot .bottle-sand{opacity:0}.stock-slot.unlocked .bottle-sand{opacity:1}.clock-action.ready .icon svg{transform-origin:50% 50%;animation:hourglass-ready-sway .55s ease-in-out infinite alternate}@keyframes hourglass-ready-sway{from{transform:rotate(-13deg)}to{transform:rotate(13deg)}}@media(prefers-reduced-motion:reduce){.clock-action.ready .icon svg{animation:none}}.stock-slot:not(.unlocked){visibility:hidden}.stock-slot.unlocked svg{transform-origin:50% 50%;animation:bottle-acquired-sway 1s ease-in-out 1 both}@keyframes bottle-acquired-sway{0%,100%{transform:rotate(0)}15%,45%,75%{transform:rotate(-15deg)}30%,60%,90%{transform:rotate(15deg)}}@media(prefers-reduced-motion:reduce){.stock-slot.unlocked svg{animation:none}}.money-counter{display:flex;align-items:center;gap:4px;font-size:12px;color:#ffe19a}.money-counter img{width:20px;height:20px;object-fit:contain}.resource-row{flex-wrap:wrap}</style>
</head>
<body>
<main id="app">
  <canvas id="field" aria-label="ゲーム盤面"></canvas>
  <div class="hud"><div><div class="brand">針の刻</div><div class="round-label">ラウンド <span id="roundNumber">1</span></div><div class="score">討伐 <span id="score">0</span>/<span id="roundTarget">10</span></div><div class="elapsed">経過 <span id="elapsedTime">0:00</span></div></div><div class="status"><div class="resource-row"><div class="money-counter" aria-label="所持金"><img id="moneyIcon" alt="" hidden><span>所持金 <b id="moneyValue">0</b></span></div><div id="swordCounter" class="sword-counter" aria-label="剣カウント"><span class="sword-counter-icon" aria-hidden="true">🗡️</span><b id="attackCount">0</b></div><div class="energy-wrap"><div class="energy-bar" role="progressbar" aria-label="行動力" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="energyFill" class="energy-fill"></div><div id="grayDamageFill" class="gray-damage-fill"></div><b id="energyValue">0</b></div></div></div><div class="top-actions"><button id="instantKillButton" class="map-link instant-kill" type="button">即死</button><button id="speedButton" class="map-link speed-control" type="button">速度×1</button><button id="pauseButton" class="map-link" type="button">一時停止</button></div></div></div>
  <div class="hint">ドラッグ移動・タップで向き変更・剣2秒で一回転斬り</div>
  <div id="killWarning" class="kill-warning hidden" role="alert" aria-live="assertive"><span>撃破まであと</span><b id="killCountdown">5</b></div>
  <div class="controls"><div id="clockStock" class="clock-stock" aria-label="砂のビンのストック"></div><div class="actions"><button id="clockButton" class="action clock-action" aria-label="砂時計を使う" disabled><span id="buttonHourglass" class="icon"></span><b id="clockCount">0</b></button><button id="attack" class="action attack-action" aria-label="剣で攻撃。2秒長押しで一回転斬り"><span class="icon">🗡️</span></button></div></div>
<div id="overlay" class="overlay" tabindex="0"><div id="panel" class="panel selecting refill merging"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p id="description"></p><div id="mergeStage" class="merge-stage" aria-label="砂の瓶を砂時計へ合体"><div id="mergeBottles" class="merge-bottles"><span class="merge-bottle empty" style="--bottle-color:#fff9e8;--start-x:0px;--start-y:0px;--merge-rotate:-18deg"><svg viewBox="0 0 32 42" aria-hidden="true"><path d="M12 2h8v6l4 4v24c0 3-2 4-5 4h-6c-3 0-5-1-5-4V12l4-4z"/><path d="M10 9h12"/></svg></span></div><div id="mergeHourglass" class="merge-hourglass empty" style="--sand-level:0"><svg class="hourglass-svg" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 2h18M7 30h18M9 3v4c0 4 7 7 7 9s-7 5-7 9v4M23 3v4c0 4-7 7-7 9s7 5 7 9v4"/><path class="sand-source" d="M10 24Q16 21 22 24V28H10Z"/></svg></div><div class="merge-flash"></div></div><div id="sandPreview" class="sand-preview"><div id="previewHourglass"></div><div class="powder-fall" aria-hidden="true"><i style="--grain-x:-7px;--grain-size:3px;--grain-delay:0s"></i><i style="--grain-x:4px;--grain-size:2px;--grain-delay:.08s"></i><i style="--grain-x:-2px;--grain-size:2px;--grain-delay:.15s"></i><i style="--grain-x:7px;--grain-size:3px;--grain-delay:.22s"></i><i style="--grain-x:-5px;--grain-size:2px;--grain-delay:.3s"></i></div><span id="previewSandCount">0/10</span></div><div id="resultValue" class="result-value" aria-live="polite"></div><button id="stop" class="primary">光を</button><p class="recovery-prompt">光を</p><p class="sub" id="sub"></p></div></div>
  <div id="pauseScreen" class="overlay pause-screen hidden"><div class="panel pause-panel">
    <div id="pauseMenu"><div class="eyebrow">PAUSE</div><p class="pause-message">ゲームを一時停止しています</p><div class="pause-actions"><button id="resumeButton" class="primary" type="button">再開</button><button id="gridToggle" class="grid-toggle" type="button" aria-pressed="false">グリッド表示：OFF</button><button id="pauseTitleButton" class="pause-title" type="button">タイトルへ</button></div>
    <div class="zoom-controls" role="group" aria-label="カメラのズーム"><span aria-hidden="true">📷</span><button id="zoomIn" type="button" aria-label="ズームイン">＋</button><output id="zoomValue" aria-live="polite">100%</output><button id="zoomOut" type="button" aria-label="ズームアウト">−</button></div></div>
    <div id="titleConfirm" hidden><h2>タイトルへ戻りますか</h2><div class="pause-actions"><button id="confirmTitleYes" class="pause-title" type="button">はい</button><button id="confirmTitleNo" class="primary" type="button">いいえ</button></div></div>
  </div></div>
  <div id="clearScreen" class="overlay clear-screen hidden"><div id="clearAnnouncement" class="clear-announcement">討伐完了</div><div class="panel clear-panel"><div class="clear-rays"></div><div id="clearHourglass" class="clear-hourglass"></div><div class="eyebrow">ALL ROUNDS COMPLETE</div><h1 class="clear-title">GAME CLEAR</h1><p class="clear-stats">ラウンド3を制覇<br>討伐数 <span id="clearScore">0</span>・経過 <span id="clearTime">0:00</span></p><div id="clearActions" class="clear-actions"><button id="clearRetry" class="primary clear-retry" type="button">もう一度遊ぶ</button><a id="clearTitleLink" class="map-link" href="index.html">タイトルへ</a></div></div></div>
</main>
<script src="movement-bounds.js"></script>
<script src="world-spawn.js"></script>
  <script src="map-collision.js"></script>
<script src="map-data.js?world=1"></script>
<script src="map-destruction.js?v=1"></script>
<script>
  const initialPreview=new URLSearchParams(location.search);
  if(initialPreview.has('effectPreview')||initialPreview.has('clearPreview')){
    document.getElementById('overlay').classList.add('hidden');
  }else{
    window.__clockAttackInitialMergeStartedAt=performance.now();
    requestAnimationFrame(()=>requestAnimationFrame(()=>document.getElementById('mergeStage').classList.add('collapsing','absorbing')));
  }
</script>

<script src="sandbox-engine.js?v=1.15"></script>

</body>
