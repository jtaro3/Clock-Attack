<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#101923">
  <title>針の刻 v0.39 — 時計で戦うゲーム</title>
  <style>
    :root{font-family:system-ui,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#f4f1e7;background:#101923;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
    *{box-sizing:border-box;-webkit-touch-callout:none}body{margin:0;overflow:hidden;touch-action:none;overscroll-behavior:none}button{font:inherit;touch-action:none;-webkit-tap-highlight-color:transparent}

    .actions{position:absolute;right:18px;bottom:0;display:flex;align-items:end;gap:12px;pointer-events:auto}.action{width:78px;height:78px;border:2px solid #f6e2a4;border-radius:21px;background:#263746d9;color:#fff5db;box-shadow:0 8px 20px #0007;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;font-weight:900}.action:active{transform:scale(.95);background:#7e6240}.action .icon{font-size:30px;line-height:1}.action b{font-size:18px}.action:disabled{opacity:.42}.clock-action{border-color:#9ae0df;color:#d7f4ee}.clock-action[data-clock=blue]{border-color:#66c8ee;color:#66c8ee}.clock-action[data-clock=green]{border-color:#74d590;color:#74d590}.clock-action[data-clock=red]{border-color:#e97a83;color:#e97a83}.clock-action .icon svg{display:block;width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}.clock-action.ready{box-shadow:0 0 0 3px #9ae0df55,0 0 18px #9ae0df88}.clock-action[data-clock=green].ready{box-shadow:0 0 0 3px #74d59055,0 0 18px #74d59088}.clock-action[data-clock=red].ready{box-shadow:0 0 0 3px #e97a8355,0 0 18px #e97a8388}.attack-action.charging{background:conic-gradient(#d1a453 0 var(--charge,0%),#263746 var(--charge,0%) 100%);box-shadow:0 0 0 3px #e7c47e88}

    .hourglass-svg{display:block;width:32px;height:32px;stroke:currentColor;fill:none;stroke-width:2;stroke-linejoin:round}.hourglass-svg .sand-step{fill:#fff9e8;stroke:none;opacity:0}.hourglass-svg .sand-step.filled{opacity:1}.hourglass-svg .sand-source,.hourglass-svg .sand-target{fill:var(--sand-color,#fff9e8);stroke:none;transform-box:fill-box}.hourglass-svg .sand-source{transform:scaleY(var(--sand-level,0));transform-origin:center top}.hourglass-svg .sand-target{transform:scaleY(0);transform-origin:center top}.hourglass-svg .sand-stream{stroke:var(--sand-color,#fff9e8);stroke-width:1.2;stroke-dasharray:2 1.5;opacity:0}.sand-preview{display:none;margin:18px auto 18px;color:#e5f2ed;font-size:12px;font-weight:800;animation:hourglass-born .35s cubic-bezier(.2,1.4,.4,1)}.sand-preview .hourglass-svg{width:120px;height:150px;margin:0 auto 8px;transition:transform .433s ease-in-out}.sand-preview.flipped .hourglass-svg{transform:rotate(180deg)}.sand-preview.flowing .sand-source{animation:sand-drain .533s linear forwards}.sand-preview.flowing .sand-target{animation:sand-fill .533s linear forwards}.sand-preview.flowing .sand-stream{opacity:1;animation:sand-fall .13s linear infinite}.sand-preview.flowed .sand-source{transform:scaleY(0)}.sand-preview.flowed .sand-target{transform:scaleY(var(--sand-level,0))}.merge-stage{display:none;position:relative;height:180px;margin:8px -8px 6px;align-items:center;justify-content:center}.merge-bottles{position:relative;width:min(100%,430px);height:120px}.merge-bottle{position:absolute;left:50%;top:50%;width:42px;height:58px;transform:translate(calc(-50% + var(--start-x)),calc(-50% + var(--start-y))) scale(1);opacity:1;transition:transform .65s cubic-bezier(.55,0,.45,1),opacity .2s .55s;filter:drop-shadow(0 0 8px var(--bottle-color))}.merge-bottle svg{width:100%;height:100%;stroke:#e8f7f3;fill:none;stroke-width:1.8;stroke-linejoin:round}.merge-bottle .bottle-fill{fill:var(--bottle-color);stroke:none}.merge-stage.collapsing .merge-bottle{transform:translate(-50%,-50%) scale(.22) rotate(var(--merge-rotate));opacity:0}.merge-flash{position:absolute;left:50%;top:50%;width:22px;height:22px;border-radius:50%;background:#fff;transform:translate(-50%,-50%) scale(0);opacity:0;box-shadow:0 0 30px #fff,0 0 70px #ffeaa8}.merge-stage.collapsing .merge-flash{animation:merge-flash .48s .48s ease-out}.panel.refill.merging .merge-stage{display:flex}.panel.refill.merging .sand-preview{display:none}.panel.refill.merging #stop,.panel.refill.merging #debug{visibility:hidden}.panel.refill .clock,.panel.refill .eyebrow,.panel.refill h1,.panel.refill #description,.panel.refill #previewSandCount,.panel.selecting:not(.refill) #eyebrow{display:none}.panel.refill .sand-preview{display:block}.panel.turning #stop{animation:none}.round-label{font-size:16px;font-weight:900;color:#ffe49b}.elapsed{display:block}@keyframes sand-drain{from{transform:scaleY(var(--sand-level,0))}to{transform:scaleY(0)}}@keyframes sand-fill{from{transform:scaleY(0)}to{transform:scaleY(var(--sand-level,0))}}@keyframes sand-fall{to{stroke-dashoffset:-3.5}}@keyframes merge-flash{0%{opacity:0;transform:translate(-50%,-50%) scale(0)}40%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(8)}}@keyframes hourglass-born{from{opacity:0;transform:scale(.35)}to{opacity:1;transform:scale(1)}}
    .hint{position:absolute;bottom:calc(100px + env(safe-area-inset-bottom));left:12px;right:12px;text-align:center;color:#f4efdfaa;font-size:12px;pointer-events:none}
    .hud{background:linear-gradient(#10251bd9,#10251b00);padding-bottom:25px}.hint{left:50%;right:auto;transform:translateX(-50%);max-width:calc(100% - 20px);padding:5px 9px;border-radius:8px;background:#10251bc9;color:#f2f6e4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
    .overlay{position:absolute;inset:0;background:#0c1824df;display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));z-index:5}.overlay.hidden{display:none}.panel{width:min(100%,430px);max-height:100%;overflow:auto;text-align:center;border:1px solid #e6d6ac55;border-radius:24px;background:linear-gradient(155deg,#253742,#14242f);padding:22px 20px 25px;box-shadow:0 20px 65px #0008}.eyebrow{color:#dfbd73;font-size:12px;font-weight:900;letter-spacing:.18em}.panel h1{font-size:27px;margin:8px 0 4px;letter-spacing:.08em}.panel p{margin:6px 0 14px;color:#dddccf;font-size:13px;line-height:1.6}.clock{position:relative;width:min(55vw,215px);height:min(55vw,215px);margin:10px auto 12px;border-radius:50%;border:8px solid #d8bd82;background:radial-gradient(circle,#f8efd8,#ded1af);box-shadow:0 0 0 5px #8b6e46,0 12px 26px #0006}.tick{position:absolute;left:50%;top:50%;width:2px;height:8px;background:#6a5947;transform-origin:50% 0}.numeral{position:absolute;transform:translate(-50%,-50%);color:#3b4447;font-size:14px;font-weight:900}.hand{position:absolute;left:50%;top:50%;transform-origin:50% 100%;border-radius:9px}.hand.hour{width:7px;height:52px;margin-left:-3.5px;margin-top:-52px;background:#bd6453;box-shadow:0 0 3px #333}.hand.minute{width:4px;height:75px;margin-left:-2px;margin-top:-75px;background:#3d7780}.pin{position:absolute;left:50%;top:50%;width:13px;height:13px;border-radius:50%;background:#343b40;transform:translate(-50%,-50%)}.readout{font-size:32px;font-weight:900;letter-spacing:.12em;font-variant-numeric:tabular-nums}.gains{display:flex;justify-content:center;gap:10px;margin:7px 0 15px}.gain{padding:7px 13px;border-radius:10px;background:#ffffff13;font-size:13px;font-weight:800}.gain strong{font-size:20px;color:#ffdda2}.gain.move strong{color:#9ae0df}.primary{min-width:180px;padding:13px 28px;background:#e7c47e;border:0;border-radius:999px;color:#202c31;font-size:17px;font-weight:900;box-shadow:0 5px 0 #9f783e}.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #9f783e}.sub{font-size:11px!important;color:#c3c9c4!important;margin:15px 0 0!important}.gameover .clock,.gameover .gains,.gameover .readout{display:none}
    .panel.selecting .result-value,.panel.paused .result-value,.panel.gameover .result-value{display:none}.panel.paused .clock,.panel.paused #stop,.panel.confirmed .clock,.panel.confirmed #stop{display:none}.panel.confirmed .sub{font-size:15px!important;color:#f1e9d1!important;font-weight:900}.result-value{font-size:clamp(64px,20vw,100px);line-height:1.1;font-weight:900;color:#ffdc72;text-shadow:0 0 28px #f8cc5b77;margin:20px 0 15px}.energy-wrap{width:min(38vw,175px);min-width:100px;margin-bottom:5px}.energy-bar{height:22px;position:relative;overflow:hidden;border:2px solid #f5dc8e;border-radius:11px;background:#493f26;box-shadow:0 2px 7px #0008}.energy-fill{height:100%;width:0;background:linear-gradient(90deg,#e9b94b,#ffe889)}.energy-bar b{position:absolute;inset:0;display:grid;place-items:center;color:#1d2521;text-shadow:0 1px #fff5b1;font-size:14px;font-weight:900}.attack-action{border-bottom:6px solid #e76762}.attack-action.available .icon{animation:sword-idle 1.1s ease-in-out infinite alternate;transform-origin:50% 80%}@keyframes sword-idle{from{transform:rotate(-18deg)}to{transform:rotate(24deg)}}
    .debug-button{display:block;margin:10px auto 0;min-width:180px;padding:9px 18px;border:1px solid #b8c7c280;border-radius:999px;background:#ffffff12;color:#e5ece8;font-size:13px;font-weight:800}.debug-button:active{background:#ffffff25}.panel:not(.selecting) .debug-button{display:none}
    .energy-bar b{color:#fff9dc;text-shadow:0 1px 3px #17231d,0 0 4px #17231d}.gray-damage-fill{position:absolute;right:0;top:0;bottom:0;width:0;background:#050606;transition:width .16s ease;pointer-events:none}.energy-bar.hit{border-color:#ff8a79;background:#55221f}.energy-bar.hit .energy-fill{background:linear-gradient(90deg,#d53732,#ff7461)}.panel.selecting #description,.panel.selecting #sub{display:none}.panel.selecting #stop{animation:clock-pulse .75s ease-in-out infinite alternate}@keyframes clock-pulse{from{opacity:.48;box-shadow:0 0 5px #e7c47e55}to{opacity:1;box-shadow:0 0 25px #ffe28bcc}}.pause-screen{z-index:6}.pause-panel .map-link{display:block;width:fit-content;margin:19px auto 0}
    .kill-warning{position:absolute;z-index:4;left:50%;top:30%;transform:translate(-50%,-50%);min-width:190px;padding:13px 24px;text-align:center;border:3px solid #ff665f;border-radius:18px;background:#281311e8;color:#fff4db;box-shadow:0 0 28px #ff3b30aa;pointer-events:none;animation:warning-pulse .45s ease-in-out infinite alternate}.kill-warning.hidden{display:none}.kill-warning span{display:block;font-size:15px;font-weight:900;letter-spacing:.15em}.kill-warning b{display:block;margin-top:2px;color:#ffdf6b;font-size:62px;line-height:1}@keyframes warning-pulse{from{filter:brightness(.8);transform:translate(-50%,-50%) scale(.97)}to{filter:brightness(1.25);transform:translate(-50%,-50%) scale(1.03)}}
    @media(max-height:650px){.panel{padding:13px}.panel p{margin:3px 0 8px}.clock{width:145px;height:145px;margin:4px auto}.hand.hour{height:37px;margin-top:-37px}.hand.minute{height:53px;margin-top:-53px}.gains{margin:2px 0 8px}.panel h1{font-size:22px}.readout{font-size:25px}}
    @media(max-width:360px){.hud{padding:10px}.score{font-size:19px}.status{font-size:11px}.actions{right:12px;gap:8px}.action{width:68px;height:72px;border-radius:17px}.action .icon{font-size:26px}.clock-stock{left:8px;right:164px}.hint{font-size:11px}}
    .sand-preview{position:relative}.hourglass-svg .sand-source{transform-origin:center bottom}.powder-fall{position:absolute;left:50%;top:61px;width:66px;height:76px;transform:translateX(-50%);pointer-events:none}.powder-fall i{position:absolute;left:calc(50% + var(--grain-x));top:4px;width:var(--grain-size);height:var(--grain-size);border-radius:50%;background:#fff9e8;box-shadow:0 0 4px #fff;opacity:0}.sand-preview.flowing .powder-fall i{animation:powder-drop .42s linear var(--grain-delay) infinite}@keyframes powder-drop{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1}85%{opacity:.9}100%{opacity:0;transform:translateY(54px) scale(1.15)}}
  </style>
</head>
<body>
<main id="app">
  <canvas id="field" aria-label="ゲーム盤面"></canvas>
  <div class="hud"><div><div class="brand">針の刻</div><div class="round-label">ラウンド <span id="roundNumber">1</span></div><div class="score">討伐 <span id="score">0</span>/<span id="roundTarget">10</span></div><div class="elapsed">経過 <span id="elapsedTime">0:00</span></div></div><div class="status"><div class="energy-wrap"><div class="energy-bar" role="progressbar" aria-label="行動力" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="energyFill" class="energy-fill"></div><div id="grayDamageFill" class="gray-damage-fill"></div><b id="energyValue">0</b></div></div><button id="pauseButton" class="map-link" type="button">一時停止</button></div></div>
  <div class="hint">ドラッグ移動・タップで向き変更・剣2秒で一回転斬り</div>
  <div id="killWarning" class="kill-warning hidden" role="alert" aria-live="assertive"><span>撃破まであと</span><b id="killCountdown">5</b></div>
  <div class="controls"><div id="clockStock" class="clock-stock" aria-label="砂のビンのストック"></div><div class="actions"><button id="clockButton" class="action clock-action" aria-label="砂時計を使う" disabled><span id="buttonHourglass" class="icon"></span><b id="clockCount">0</b></button><button id="attack" class="action attack-action" aria-label="剣で攻撃。2秒長押しで一回転斬り。数字は剣カウント"><span class="icon">🗡️</span><b id="attackCount">0</b></button></div></div>
  <div id="overlay" class="overlay"><div id="panel" class="panel selecting"><div class="eyebrow" id="eyebrow"></div><h1 id="title">時を止めて、戦え。</h1><p id="description">時計が回る間に光を押して、行動力を決めよう。</p><div class="clock" id="clock"><div class="hand hour" id="hourHand"></div><div class="hand minute" id="minuteHand"></div><div class="pin"></div></div><div id="mergeStage" class="merge-stage" aria-label="砂の瓶を砂時計へ合体"><div id="mergeBottles" class="merge-bottles"></div><div class="merge-flash"></div></div><div id="sandPreview" class="sand-preview"><div id="previewHourglass"></div><div class="powder-fall" aria-hidden="true"><i style="--grain-x:-7px;--grain-size:3px;--grain-delay:0s"></i><i style="--grain-x:4px;--grain-size:2px;--grain-delay:.08s"></i><i style="--grain-x:-2px;--grain-size:2px;--grain-delay:.15s"></i><i style="--grain-x:7px;--grain-size:3px;--grain-delay:.22s"></i><i style="--grain-x:-5px;--grain-size:2px;--grain-delay:.3s"></i></div><span id="previewSandCount">0/10</span></div><div id="resultValue" class="result-value" aria-live="polite"></div><button id="stop" class="primary">光を</button><button id="debug" class="debug-button" type="button">デバッグ（行動力100）</button><p class="sub" id="sub">時計は止めるまで回り続けます</p></div></div>
  <div id="pauseScreen" class="overlay pause-screen hidden"><div class="panel pause-panel"><div class="eyebrow">PAUSE</div><h1>一時停止</h1><p>ゲームを一時停止しています</p><button id="resumeButton" class="primary" type="button">再開</button><a class="map-link" href="index.html">タイトルへ</a></div></div>
</main>
<script src="map-data.js"></script>
<script src="game.js"></script>
</body>
</html>
