<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>対戦サンドバッグ</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10211e;color:#edf4df}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;gap:20px;padding:12px 20px;background:#173029}a{color:#f2d38d}h1{font-size:20px;margin:0}main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding:16px;max-width:1250px;margin:auto}.field{min-width:0}canvas{display:block;width:auto;max-width:100%;max-height:calc(100dvh - 250px);height:auto;margin:0 auto;aspect-ratio:4/3;background:#000;border:1px solid #6a8577;touch-action:none}.hud{display:flex;gap:20px;justify-content:space-between;padding:10px;font-weight:700}.controls{display:flex;justify-content:center;gap:16px;padding:14px}button,select{font:inherit;border:1px solid #a4bea8;border-radius:10px;padding:10px;background:#264538;color:#fff;cursor:pointer}#start{background:#b52f40;border-color:#f5a4a9;font-weight:bold;min-width:140px}#attack{width:90px;height:90px;border-radius:50%;font-weight:bold;background:#284d64;border:3px solid #d1e5f0}button:disabled{opacity:.45;cursor:default}aside{padding:16px;background:#173029;border:1px solid #637c68;border-radius:14px}label{display:block;margin:10px 0;font-size:14px}select{width:100%}label.slider{display:grid;grid-template-columns:1fr auto;gap:6px}input[type=range]{grid-column:1/-1;width:100%}output{color:#f2d38d;font-variant-numeric:tabular-nums}h2{font-size:16px;margin:18px 0 8px}.hint{font-size:13px;line-height:1.6;color:#cad8cb}.player-color{color:#67d9ff}.enemy-color{color:#ff8696}#status{min-height:30px;color:#f2d38d}#masterReset{width:100%}@media(max-width:760px){main{display:block;padding:8px}aside{margin-top:12px}canvas{aspect-ratio:4/3}.hud{font-size:13px;gap:8px}}
</style></head><body>
<header><a href="animation.html">演出確認へ</a><h1>対戦サンドバッグ</h1><span id="version"></span></header>
<main><section class="field"><div class="hud"><span class="player-color" id="playerHp"></span><span class="enemy-color" id="enemyHp"></span></div><canvas id="arena" width="640" height="480" aria-label="対戦フィールド"></canvas><div class="controls"><button id="start" disabled>スタート</button><button id="attack" disabled>攻撃</button><button id="reset" disabled>配置を戻す</button></div><div id="status" aria-live="polite">マスター読み込み中</div><p class="hint">停止中はキャラクターを350ms長押ししてドラッグすると配置を変えられます。スタート後はWASD・矢印キー、またはフィールドをタップ／ドラッグしてプレイヤーを移動。スペースキーでも攻撃できます。</p></section>
<aside><label>対戦するエネミー<select id="enemySelect"></select></label><label>AIの比較<select id="aiSelect"><option value="chase">chase（従来の追跡）</option><option value="chase2">chase2（試作）</option></select></label><p id="aiInfo" class="hint"></p><label><input id="grid" type="checkbox" checked> グリッド表示（32px）</label><label class="player-color"><input id="playerRange" type="checkbox" checked> プレイヤーの攻撃範囲</label><label class="enemy-color"><input id="enemyRange" type="checkbox" checked> エネミーの攻撃範囲</label><h2 class="player-color">プレイヤー</h2><div id="playerSliders"></div><h2 class="enemy-color">エネミー</h2><div id="enemySliders"></div><button id="masterReset" disabled>マスターの値に戻す</button><p class="hint">数値の調整はこの画面で試せます。chase2はAIシートの攻撃・被弾設定を参照します。super_armorが有効な敵は怯まず、押し戻されません。HPは行動力とは別の対戦用HPとして扱います。</p></aside></main>
<script src="attack-range.js?v=1.30"></script><script src="sandbox-engine.js?v=1.15"></script><script src="asset-paths.js?v=1.19"></script><script src="sandbox.js?v=1.33"></script></body></html>
