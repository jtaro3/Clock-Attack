<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>針の刻｜画面遷移サンプル</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1d18;color:#f6f1da;font-family:system-ui,sans-serif}button,a{font:inherit;-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:5px}button{border:1px solid #95ac91;border-radius:20px;color:inherit;background:#24483c;padding:18px;font-weight:800}main{max-width:540px;margin:auto;min-height:100svh;background:radial-gradient(ellipse at 50% 25%,#28493b,#10261f 75%);overflow:hidden}section{min-height:100svh;padding:calc(22px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));animation:enter .25s ease-out}section[hidden]{display:none}header{display:flex;align-items:center;justify-content:space-between;gap:12px}header button{padding:10px 16px;border-radius:50px;font-size:14px}.tag{font-size:11px;color:#dcc17b;letter-spacing:.12em}.home{display:flex;flex-direction:column;justify-content:center;text-align:center;gap:18px}.logo{font-size:64px;color:#e9c771;line-height:1}h1{font-size:54px;margin:4px 0;letter-spacing:.12em}h2{font-size:24px;margin:26px 0 8px}.home p{margin:0;color:#bacdc2}.home .actions{display:grid;gap:18px;margin-top:38px}.primary{background:#e9cc86;color:#142b22;min-height:74px;font-size:23px}.home a{display:block;text-decoration:none;color:#f6f1da;border:1px solid #95ac91;border-radius:20px;padding:22px;background:#24483c;font-size:22px;font-weight:800}.note{font-size:12px;color:#9db5a8;margin:18px 0;line-height:1.7}.difficulty{text-align:center}.difficulty header{text-align:left}.instruction{color:#adbfaf;font-size:13px}.wheel{height:min(62svh,520px);min-height:290px;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;perspective:800px;touch-action:pan-y;position:relative;margin-top:10px;mask-image:linear-gradient(transparent,#000 13%,#000 87%,transparent)}.wheel::-webkit-scrollbar{display:none}.space{height:calc(50% - 66px)}.slot{height:132px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center}.choice{width:90%;max-width:340px;height:106px;font-size:32px;letter-spacing:.05em;border-radius:22px;transform:scale(var(--scale,.7));opacity:var(--opacity,.55);box-shadow:0 16px 24px #0004;will-change:transform;transition:filter .1s}.choice small{display:block;font-size:12px;letter-spacing:.12em;margin-top:4px}.easy{background:#63c8eb;color:#102b39;border-color:#a2e9ff}.normal{background:#ebce77;color:#352c13;border-color:#fff0b2}.hard{background:#d65c58;color:#fff4e8;border-color:#ffaca0}.choice.center{box-shadow:0 0 0 3px #fff7,0 16px 30px #0005}.badge{border-radius:50px;padding:7px 16px;font-weight:800;font-size:13px}.maps .list{display:grid;gap:16px;margin:26px 0}.map-card{display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;padding:16px;width:100%;background:#244438;min-height:120px}.map-card strong{display:block;font-size:22px}.map-card small{display:block;color:#bed0bd;margin-top:9px;font-size:13px}.map-card canvas{width:100px;height:86px;border-radius:12px;border:1px solid #c5d4a477;image-rendering:pixelated}.field{padding:0;position:relative}.field>canvas{width:100%;height:100svh;display:block;image-rendering:pixelated}.field header{position:absolute;top:calc(16px + env(safe-area-inset-top));left:16px;right:16px;padding:10px;border-radius:18px;background:#10291fe6}.field .caption{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));left:20px;right:20px;text-align:center;border-radius:20px;padding:18px;background:#10291fe6;color:#e7e6cd;font-size:14px}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){section{animation:none}}
</style></head><body><main>
<section id="home" class="home"><div class="tag">画面遷移サンプル · v1.44</div><div class="logo" aria-hidden="true">◷</div><h1>針の刻</h1><p>時計で戦うゲーム</p><div class="actions"><button id="stageSelect" class="primary">ステージセレクト</button><a href="animation.html">演出確認</a></div></section>
<section id="difficulty" class="difficulty" hidden><header><button data-back="home">← 戻る</button><span class="tag">01 / DIFFICULTY</span></header><h2>難易度を選択</h2><p class="instruction">上下にスクロールして、難易度をタップ</p><div class="wheel" id="wheel"><div class="space"></div><div class="slot"><button class="choice easy" data-difficulty="easy">EASY<small>イージー</small></button></div><div class="slot"><button class="choice normal" data-difficulty="normal">NORMAL<small>ノーマル</small></button></div><div class="slot"><button class="choice hard" data-difficulty="hard">HARD<small>ハード</small></button></div><div class="space"></div></div></section>
<section id="maps" class="maps" hidden><header><button data-back="difficulty">← 難易度</button><span id="difficultyBadge" class="badge"></span></header><h2>ステージを選択</h2><div class="list" id="mapList"></div><p class="note">草原マップを使ったサンプルです。各サムネイルは同じマップの異なる場所を表示しています。</p></section>
<section id="field" class="field" hidden><canvas id="fieldCanvas"></canvas><header><button data-back="maps">← マップ一覧</button><strong id="fieldTitle"></strong></header><div class="caption">フィールドへの遷移確認<br>戦闘はこのサンプルでは行いません。</div></section>
</main><script src="transition-sample.js?v=1.44"></script></body></html>
